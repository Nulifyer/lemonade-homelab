name: Homelab native service checks
on:
  push:
    branches: [homelab-runtime]
    paths:
      - src/cpp/**
      - test/**
      - contrib/homelab/**
      - CMakeLists.txt
      - .github/workflows/homelab-checks.yml
  pull_request:
    paths:
      - src/cpp/**
      - test/**
      - contrib/homelab/**
      - CMakeLists.txt
      - .github/workflows/homelab-checks.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homelab-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    if: github.repository == 'Nulifyer/lemonade-homelab'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: contrib/homelab/Dockerfile
          target: manager-build
          cache-from: type=registry,ref=ghcr.io/nulifyer/lemonade-homelab:buildcache
          push: false
