name: Homelab chat compatibility image
on:
  push:
    branches: [homelab-runtime]
    paths: [contrib/librechat/**, .github/workflows/homelab-chat.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: homelab-chat-publication
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'Nulifyer/lemonade-homelab'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: danny-avila/LibreChat
          ref: e8f3be08623663d4ad7f7241e693c94469b63bb0
          path: upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: upstream/package-lock.json
      - name: Apply checked model-spec Skills fix
        working-directory: upstream
        run: git apply --check ../contrib/librechat/model-spec-skills.patch && git apply ../contrib/librechat/model-spec-skills.patch
      - name: Install matched source dependencies
        working-directory: upstream
        run: npm ci --no-audit
      - name: Build client and packages
        working-directory: upstream
        run: npm run frontend
      - name: Check client types and model-spec behavior
        working-directory: upstream/client
        run: |
          npx tsc --noEmit
          npm run test:ci -- --runInBand src/utils/__tests__/applyModelSpecEphemeralAgent.test.ts
      - name: Check API types and explicit tool overrides
        working-directory: upstream/packages/api
        run: |
          npx tsc --noEmit
          npm test -- --runInBand src/agents/load.spec.ts
      - name: Check startup and conversation loading
        working-directory: upstream
        env:
          E2E_CHROMIUM_CHANNEL: chrome
        run: npm run lighthouse:run
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: contrib/librechat/Dockerfile
          build-contexts: |
            chat-client=./upstream/client/dist
            chat-api=./upstream/packages/api/dist
          push: true
          tags: |
            ghcr.io/nulifyer/librechat-homelab:latest
            ghcr.io/nulifyer/librechat-homelab:${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
