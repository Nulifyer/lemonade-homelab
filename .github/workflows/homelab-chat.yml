name: Homelab chat permissions image
on:
  push:
    branches: [homelab-runtime]
    paths: [contrib/librechat/**, .github/workflows/homelab-chat.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: homelab-chat-publication
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'Nulifyer/lemonade-homelab'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: contrib/librechat/Dockerfile
          push: true
          tags: |
            ghcr.io/nulifyer/librechat-homelab:latest
            ghcr.io/nulifyer/librechat-homelab:${{ github.sha }}
          build-args: SOURCE_REVISION=${{ github.sha }}
