name: Homelab compiled AI release
on:
  push:
    tags: [homelab-v*]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: homelab-image-publication
  cancel-in-progress: false
jobs:
  image:
    if: github.repository == 'Nulifyer/lemonade-homelab' && startsWith(github.ref, 'refs/tags/homelab-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: contrib/homelab/Dockerfile
          load: true
          tags: |
            ghcr.io/nulifyer/lemonade-homelab:${{ github.ref_name }}
            ghcr.io/nulifyer/lemonade-homelab:latest
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            SERVICE_VERSION=${{ github.ref_name }}
          cache-from: type=registry,ref=ghcr.io/nulifyer/lemonade-homelab:buildcache
          cache-to: type=registry,ref=ghcr.io/nulifyer/lemonade-homelab:buildcache,mode=max
      - name: Verify the default container service
        env:
          RELEASE_IMAGE: ghcr.io/nulifyer/lemonade-homelab:${{ github.ref_name }}
        run: bash contrib/homelab/test-service.sh "$RELEASE_IMAGE"
      - name: Publish the accepted image
        env:
          RELEASE_IMAGE: ghcr.io/nulifyer/lemonade-homelab:${{ github.ref_name }}
        run: |
          docker push "$RELEASE_IMAGE"
          docker push ghcr.io/nulifyer/lemonade-homelab:latest
          docker inspect --format '{{index .RepoDigests 0}}' "$RELEASE_IMAGE" | cut -d@ -f2 > image-digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
